name: PRIME Kernel Formal Verification & Living Documentation CI

on:
  push:
    branches: [main, master]
    paths:
      - "prime-kernel/**"
      - "kernel/**"
      - ".github/workflows/prime-kernel-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "prime-kernel/**"
      - "kernel/**"
      - ".github/workflows/prime-kernel-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PRIME Kernel 6-Tier Verification & SLA Gating (ADR-0027)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prime-kernel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lean 4 Toolchain
        uses: leanprover/lean4-action@v1
        with:
          toolchain-file: "prime-kernel/lean-toolchain"

      - name: Add Toolchains to PATH
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Run Unified PRIME Kernel Production Test Harness
        run: |
          python3 run_tests.py

      - name: Upload Test and Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-kernel-verification-reports
          path: prime-kernel/reports/

      - name: Publish Job Summary to GitHub Actions
        if: always()
        run: |
          if [ -f "reports/TEST_REPORT_LATEST.md" ]; then
            cat reports/TEST_REPORT_LATEST.md >> $GITHUB_STEP_SUMMARY
          fi
