[package]
name = "prism-text-request"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A modeled byte-request conformance fixture."
license = "MIT OR Apache-2.0"
repository = "https://github.com/UOR-Foundation/PrismPM"
homepage = "https://github.com/UOR-Foundation/PrismPM"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "generation-manifest.json"]

[features]
default = ["std"]
std = ["prism-stdlib/std"]

[dependencies]
prism-stdlib = { version = "=0.2.0", default-features = false, features = [] }

[lib]
path = "src/lib.rs"
